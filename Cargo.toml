[package]
name = "bear-security"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "A small Discord security and moderation bot built as the final version of Bear Security."
license = "MIT"
repository = "https://github.com/mykeyy/Bear-Secuirty"
keywords = ["discord", "moderation", "security", "bot", "twilight"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1.0"
dotenvy = "0.15"
libsql = { version = "0.9.30", default-features = false, features = ["remote"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring", "webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-platform-verifier", "zlib"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["decompression", "rustls-platform-verifier"] }
twilight-model = "0.17.1"
twilight-util = { version = "0.17.0", features = ["builder"] }
webpki-roots = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
