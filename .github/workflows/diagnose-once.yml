name: Diagnose CI once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt
      - name: Capture Clippy output
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings > ci-diagnostic.txt 2>&1
          code=$?
          printf '\nBEAR_SECURITY_CLIPPY_EXIT=%s\n' "$code" >> ci-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostic.txt
          git commit -m "ci: capture Rust diagnostic"
          git push
